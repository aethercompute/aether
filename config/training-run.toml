[server]
state_path = "config/aether0-50m/state.toml"
data_config = "config/aether0-50m/data.toml"
experiment_path = "config/experiment-run.toml"
experiment_enabled = false
server_port = 39405
live_web_port = 8081
tui = false

[dataset]
enabled = true
objective = "pretraining"
script = "scripts/prepare-ultra-fineweb-local.py"
output_dir = "data/aether0-50m-mistral-1024-bin"
sequence_length = 1024
num_sequences = 4882944
shard_size = 8192
token_bytes = 2
dataset = "openbmb/Ultra-FineWeb"
split = "en"
text_field = "content"
tokenizer = "mistralai/Mistral-7B-v0.1"
seed = 1337
buffer_docs = 0
trust_remote_code = false

[model]
enabled = true
script = "scripts/push-new-model-hf.py"
config = "config/aether0-50m/model-config.json"
repo = "aethercompute/aether0-50m"
tokenizer = "mistralai/Mistral-7B-v0.1"
private = false
dtype = "bfloat16"

[checkpoint]
dir = "checkpoints/{run_id}"
hub_repo = "aethercompute/aether0-50m"
gcs_bucket = ""
gcs_prefix = ""
delete_old_steps = true
keep_steps = 3
epoch_interval = 1
